# Sequential Deploy Pipeline (Staging → Production)
#
# Deploys the API to staging first, verifies it, then promotes to production.
# This ensures production never receives untested code.
#
#   1. deploy-staging         — Deploy Tail Worker + API to staging.
#   2. verify-staging         — Health check + smoke tests against staging.
#   3. deploy-production      — Deploy Tail Worker + API to production.
#   4. e2e                    — Run the full API E2E suite against production.
#   5. deploy-ts-client       — Publish ollama-models to npm.
#   6. deploy-docs            — Deploy docs to Cloudflare Pages.
#   7. verify-docs-production — Verify Pages deployment and the custom domain.

name: Deploy

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'api/**'
      - '!api/openapi.json'
      - '!api/README.md'
      - 'packages/ts-client/**'
      - '!packages/ts-client/README.md'
      - 'packages/py-client/**'
      - '!packages/py-client/README.md'
      - 'docs/**'
      - '!docs/README.md'
      - 'workers/**'
      - '.github/workflows/deploy.yml'
      - 'scripts/e2e.sh'
      - 'scripts/wait-for-pages-routing.ts'

concurrency:
  group: deploy-main
  cancel-in-progress: false

env:
  API_URL: https://ollama-models-api.devcomfort.workers.dev
  STAGING_URL: https://ollama-models-api-staging.devcomfort.workers.dev

jobs:
  # ─── 1. Deploy to staging ──────────────────────────────────────────────────
  deploy-staging:
    name: Deploy API to staging
    runs-on: ubuntu-latest
    environment: staging
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Deploy Tail Worker (alerts)
        run: npx wrangler deploy
        working-directory: workers/alerts
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Deploy API to staging
        run: npx nx run api:deploy:staging
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  # ─── 2. Verify staging ────────────────────────────────────────────────────
  verify-staging:
    name: Verify staging health
    runs-on: ubuntu-latest
    needs: deploy-staging

    steps:
      - name: Wait for propagation
        run: sleep 15
      - name: Check /health endpoint
        run: |
          echo "Checking $STAGING_URL/health ..."
          HTTP_CODE=$(curl -s -o /tmp/health.json -w "%{http_code}" "$STAGING_URL/health")
          echo "HTTP $HTTP_CODE"
          cat /tmp/health.json
          if [ "$HTTP_CODE" != "200" ]; then
            echo "❌ Health check returned HTTP $HTTP_CODE"
            exit 1
          fi
          OK=$(jq -r '.ok' /tmp/health.json)
          if [ "$OK" != "true" ]; then
            echo "❌ Health check body reports ok=false"
            exit 1
          fi
          echo "✅ API is healthy"
      - name: Smoke test /search endpoint
        run: |
          echo "Checking $STAGING_URL/search?q=qwen3&page=1 ..."
          HTTP_CODE=$(curl -s -o /tmp/search.json -w "%{http_code}" "$STAGING_URL/search?q=qwen3&page=1")
          echo "HTTP $HTTP_CODE"
          if [ "$HTTP_CODE" != "200" ]; then
            echo "❌ Search endpoint returned HTTP $HTTP_CODE"
            exit 1
          fi
          echo "✅ Search endpoint is responding"
      - name: Smoke test /model endpoint
        run: |
          echo "Checking $STAGING_URL/model?name=library/qwen3 ..."
          HTTP_CODE=$(curl -s -o /tmp/model.json -w "%{http_code}" "$STAGING_URL/model?name=library/qwen3")
          echo "HTTP $HTTP_CODE"
          if [ "$HTTP_CODE" != "200" ]; then
            echo "❌ Model endpoint returned HTTP $HTTP_CODE"
            exit 1
          fi
          echo "✅ Model endpoint is responding"

  # ─── 3. Deploy to production ───────────────────────────────────────────────
  deploy-production:
    name: Deploy API to production
    runs-on: ubuntu-latest
    needs: verify-staging
    environment: production
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Deploy Tail Worker (alerts)
        run: npx wrangler deploy
        working-directory: workers/alerts
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Deploy API to production
        run: npx nx deploy api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  # ─── 4. E2E test suite against production ──────────────────────────────────
  e2e:
    name: E2E test suite
    runs-on: ubuntu-latest
    needs: deploy-production

    steps:
      - uses: actions/checkout@v4
      - name: Run E2E tests
        run: |
          chmod +x scripts/e2e.sh
          ./scripts/e2e.sh "$API_URL"

  # ─── 5. Deploy TypeScript client ───────────────────────────────────────────
  deploy-ts-client:
    name: Publish TS client to npm
    runs-on: ubuntu-latest
    needs: e2e
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run tests
        run: npx nx test ts-client
      - name: Build
        run: npx nx build ts-client
      - name: Post-build smoke test (verify built artifact)
        run: chmod +x scripts/smoke-ts-client.sh && ./scripts/smoke-ts-client.sh
      - name: Publish to npm
        if: startsWith(github.ref, 'refs/tags/ts-v')
        run: cd packages/ts-client && pnpm publish --access public --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  # ─── 6. Deploy documentation site ─────────────────────────────────────────
  deploy-docs:
    name: Deploy docs to Cloudflare Pages
    runs-on: ubuntu-latest
    needs: e2e
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build docs
        run: npx nx build docs
        env:
          NODE_OPTIONS: --max_old_space_size=4096
      - name: Write deployment marker
        run: |
          mkdir -p docs/dist/__deploy
          printf '{"sha":"%s"}\n' "$GITHUB_SHA" > "docs/dist/__deploy/$GITHUB_SHA.json"
      - name: Deploy to Cloudflare Pages
        run: pnpm exec wrangler pages deploy --branch main --commit-hash "$GITHUB_SHA"
        working-directory: docs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Smoke test Pages routes
        run: |
          TRY_STATUS="$(curl --fail --show-error --silent --retry 6 --retry-all-errors --retry-delay 5 --output /dev/null --write-out '%{http_code}' \
            https://ollama-models.pages.dev/try/)"
          test "$TRY_STATUS" = "200"
          OPENAPI_STATUS="$(curl --fail --show-error --silent --retry 6 --retry-all-errors --retry-delay 5 --output /tmp/openapi.json --write-out '%{http_code}' \
            https://ollama-models.pages.dev/api/openapi.json)"
          test "$OPENAPI_STATUS" = "200"
          jq --exit-status '.openapi | strings' /tmp/openapi.json > /dev/null

  # ─── 7. Verify Pages deployment and the production custom domain ─────────
  verify-docs-production:
    name: Verify Pages deployment and custom domain
    runs-on: ubuntu-latest
    needs: deploy-docs
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium
      - name: Wait for deployed commit on Pages
        env:
          DEPLOYMENT_MARKER_URL: https://ollama-models.pages.dev/__deploy/${{ github.sha }}.json
        run: |
          set -euo pipefail

          for attempt in $(seq 1 24); do
            if body="$(curl --fail --silent --show-error --max-time 5 \
              -H 'Cache-Control: no-cache' \
              "${DEPLOYMENT_MARKER_URL}?run=${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${attempt}")"; then
              served_sha="$(printf '%s' "$body" | jq -r '.sha // empty' 2>/dev/null || true)"
              if [ "$served_sha" = "$GITHUB_SHA" ]; then
                echo "Pages is serving commit $GITHUB_SHA"
                exit 0
              fi
            fi

            echo "Waiting for Pages propagation (attempt $attempt/24)"
            sleep 5
          done

          echo "::error::Pages did not serve commit $GITHUB_SHA within the propagation window."
          exit 1
      - name: Wait for custom-domain routes
        run: pnpm exec tsx scripts/wait-for-pages-routing.ts
        env:
          CUSTOM_DOMAIN_BASE_URL: https://ollama.devcomfort.me
      - name: Run custom-domain Playwright E2E
        run: pnpm exec playwright test --retries=0
        env:
          PLAYWRIGHT_BASE_URL: https://ollama.devcomfort.me
          PLAYWRIGHT_LOCAL_PREVIEW: 'false'
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report-custom-domain
          path: playwright-report/
          retention-days: 7
  # ─── 8. Deploy Python client ───────────────────────────────────────────────
  # PyPI publish is handled by .github/workflows/publish-pypi.yml on 'py-v*' tag
  # pushes. OIDC Trusted Publisher is configured against that workflow file.
