name: E2E Tests

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'tests/e2e/**'
      - 'playwright.config.ts'
      - '.github/workflows/e2e.yml'
  pull_request:
    branches: [main]
    paths:
      - 'docs/**'
      - 'tests/e2e/**'
      - 'playwright.config.ts'
      - '.github/workflows/e2e.yml'

jobs:
  e2e:
    name: Playwright E2E (${{ matrix.label }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Pages build
            base_url: http://127.0.0.1:4321
            artifact: pages-build
            local_preview: true
            allow_failure: false
          - label: custom domain diagnostic
            base_url: https://ollama.devcomfort.me
            artifact: custom-domain
            local_preview: false
            allow_failure: true
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Run E2E tests
        id: e2e
        continue-on-error: ${{ matrix.allow_failure }}
        run: pnpm test:e2e
        env:
          PLAYWRIGHT_BASE_URL: ${{ matrix.base_url }}
          PLAYWRIGHT_LOCAL_PREVIEW: ${{ matrix.local_preview }}

      - name: Report custom domain outage
        if: ${{ matrix.allow_failure && steps.e2e.outcome == 'failure' }}
        run: |
          echo "::warning::Custom domain E2E failed; the Pages build E2E remains the blocking check."
          echo "### Custom domain E2E diagnostic" >> "$GITHUB_STEP_SUMMARY"
          echo "The public custom domain failed independently of the blocking Pages build E2E job." >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report-${{ matrix.artifact }}
          path: playwright-report/
          retention-days: 7
