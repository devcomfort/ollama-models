name: Health Monitor

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
    inputs:
      target_env:
        description: 'Which API to probe (cron always probes production)'
        type: choice
        options:
          - production
          - staging
        default: production

permissions: {}

concurrency:
  group: health-monitor
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:

      - name: Probe /health (3 attempts, 5s apart)
        env:
          # Cron defaults to production; manual dispatch can target staging for observation.
          TARGET_ENV: ${{ github.event.inputs.target_env || 'production' }}
        run: |
          set -uo pipefail

          if [ "$TARGET_ENV" = "staging" ]; then
            API_URL="https://ollama-models-api-staging.devcomfort.workers.dev"
          else
            API_URL="https://ollama-models-api.devcomfort.workers.dev"
          fi
          echo "Probing: $API_URL"


          # NOTE: -f is intentionally omitted. /health returns HTTP 503 when
          # ok=false; with -f, curl discards the body and we lose failure_kind.
          probe() {
            local body
            if body=$(curl -sS --max-time 15 "$API_URL/health" 2>/dev/null); then
              echo "$body" | jq -r '.failure_kind // "null"'
            else
              echo "api_unreachable"
            fi
          }

          attempt1=$(probe)
          echo "attempt1=$attempt1"

          if [ "$attempt1" != "structure_change" ]; then
            echo "First probe returned: $attempt1 — not a structure change. Exiting."
            exit 0
          fi

          echo "First probe detected structure_change. Re-checking 2 more times (5s apart)..."
          sleep 5
          attempt2=$(probe)
          echo "attempt2=$attempt2"

          if [ "$attempt2" != "structure_change" ]; then
            echo "Second probe returned: $attempt2 — transient. Exiting."
            exit 0
          fi

          sleep 5
          attempt3=$(probe)
          echo "attempt3=$attempt3"

          if [ "$attempt3" != "structure_change" ]; then
            echo "Third probe returned: $attempt3 — transient. Exiting."
            exit 0
          fi

          echo "All 3 attempts returned structure_change; auto-heal is disabled. Recording observation only."
